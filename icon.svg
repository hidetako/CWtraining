<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CW 交信トレーニング">
  <title>CW 交信トレーニング</title>
  <!--
    中央の横一列はモールスの CW（－・－・ ・－－）。
    上下の弧は、そこから広がっていく電波を表す。
    単位は 1 単位 = 19（＝線の太さ）で、短点 1・長点 3・要素間 1・文字間 3 の
    実際のモールスの間隔どおりに並べてある。
  -->
  <defs>
    <!-- userSpaceOnUse で指定する。既定の objectBoundingBox だと、
         横一直線の要素は高さ 0 の外接矩形になり描画されない -->
    <linearGradient id="cwGlow" gradientUnits="userSpaceOnUse"
                    x1="0" y1="64" x2="0" y2="448">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="0.5" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>

    <!-- ネオンらしい滲み。小さく表示したときに潰れないよう控えめにしている -->
    <filter id="cwNeon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="far"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" ry="96" fill="#050505"/>

  <g filter="url(#cwNeon)" fill="none" stroke="url(#cwGlow)"
     stroke-width="19" stroke-linecap="round">

    <!-- 上へ広がる電波 -->
    <path d="M 208.0 194.5 A 78.0 78.0 0 0 1 304.0 194.5"/>
    <path d="M 165.6 180.2 A 118.0 118.0 0 0 1 346.4 180.2"/>
    <path d="M 117.6 159.1 A 169.0 169.0 0 0 1 394.4 159.1"/>

    <!-- 下へ広がる電波 -->
    <path d="M 304.0 317.5 A 78.0 78.0 0 0 1 208.0 317.5"/>
    <path d="M 346.4 331.8 A 118.0 118.0 0 0 1 165.6 331.8"/>
    <path d="M 394.4 352.9 A 169.0 169.0 0 0 1 117.6 352.9"/>

    <!-- C ＝ －・－・ -->
    <path d="M 47 256 H 85"/>
    <path d="M 123 256 H 123"/>
    <path d="M 161 256 H 199"/>
    <path d="M 237 256 H 237"/>

    <!-- W ＝ ・－－ -->
    <path d="M 313 256 H 313"/>
    <path d="M 351 256 H 389"/>
    <path d="M 427 256 H 465"/>
  </g>
</svg>
